<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salute - Cadastro de funcionário</title>
    <meta name="author" content="Júlia Marangoni dos Santos">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div>
            <img src="logosalute.png" id="logo">
        </div>

        <div>
            <img src="salute.png" id="salute">
        </div>
    </header>

    <main>
        <h2 id="tituloCadastro">Cadastro de Funcionários</h2>
        <p class="descricao">Preencha os dados para cadastrar um novo funcionário.</p>

        <form id="formCadastro">

            <h3>Dados pessoais</h3>

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" placeholder="Digite seu endereço" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" required>

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" required>

            <h3>Informações profissionais</h3>

            <label for="cargo">Cargo:</label>
            <select id="cargo">
                <option value="">Selecione um cargo</option>
                <option value="Farmacêutico">Farmacêutico</option>
                <option value="Atendente">Atendente</option>
                <option value="Caixa">Caixa</option>
                <option value="Auxiliar de estoque">Auxiliar de estoque</option>
                <option value="Gerente">Gerente</option>
            </select>

            <label for="salario">Salário:</label>
            <input type="number" id="salario" placeholder="Ex: 2500" step="0.01">

            <label>Turno:</label>

            <div class="turnos">
                <label>
                    <input type="radio" name="turno" value="Manhã">Manhã
                </label>
                <label>
                    <input type="radio" name="turno" value="Tarde">Tarde
                </label>
                <label>
                    <input type="radio" name="turno" value="Noite">Noite
                </label>
            </div>

            <p id="mensagem"></p>

            <div class="botoes">
                <button type="submit" id="baixarTXT">Cadastrar funcionário</button>
                <button type="reset" class="limpar">Limpar</button>
            </div>

        </form>
    </main>

    <footer>
        <p>©2026 - Desenvolvido por Júlia Marangoni dos Santos</p>
    </footer>
    <script src="farmacia.js"></script>
</body>
</html>
